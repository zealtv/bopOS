name: Software tests

on:
  push:
  pull_request:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOPOS_PYTHON: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: ./tools/run-tests.sh fast

  browser:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOPOS_PYTHON: python
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium --only-shell
      - name: Run every browser journey and retain failures
        shell: bash
        run: |
          set -o pipefail
          ./tools/run-tests.sh browser 2>&1 | tee browser.log
      - name: Publish browser summary
        if: always()
        shell: bash
        run: |
          echo '### Browser journeys' >> "$GITHUB_STEP_SUMMARY"
          if [ -f browser.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/=== browser summary ===/,$p' browser.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if ! grep -q '=== browser summary ===' browser.log; then
              echo 'Browser run ended before the summary; see browser.log and the job status.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Browser setup failed; see the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-log
          path: browser.log
          if-no-files-found: warn
          retention-days: 14
