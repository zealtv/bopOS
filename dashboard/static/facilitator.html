<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>bopOS Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101316">
<link rel="apple-touch-icon" href="/icon-180.png">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/facilitator.css">
<link rel="stylesheet" href="/css/param-generator.css"><link rel="stylesheet" href="/css/control-panel.css">
<link rel="stylesheet" href="/css/value-box.css">
<link rel="stylesheet" href="/css/target-picker.css">
<link rel="stylesheet" href="/css/control-column.css">
</head>
<body>
  <div id="initial-loading" class="initial-loading" role="status" aria-live="polite" aria-label="bopOS is loading"><div class="bop-loader" aria-hidden="true"><strong>bopOS</strong><span class="bop-beats"><i></i><i></i><i></i><i></i></span><small>loading...</small></div></div>
  <header><a id="technical-link" href="/">All views</a><h1 id="venue-name">bopOS Dashboard</h1><label class="theme-control">theme <select id="theme-select" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span id="ws-status" class="offline">connecting…</span></header>
  <!-- The Remote view is one ControlColumn between the header and the fleet
       footer. The column builds its own picker, cards and status output
       (3-iframe-retirement): this page and the Control tab mount the same
       component rather than each authoring a skeleton for it. -->
  <div id="control-column-host"></div>
  <footer id="controls">
    <div id="master-row"><span class="label">Master</span><input id="master" type="range" min="0" max="1" step="0.01"><output id="master-out"></output></div>
    <div id="buttons">
      <button id="silence" class="danger">SILENCE ALL</button>
    </div>
    <div id="facilitator-commands"></div>
  </footer>
  <script src="/js/ws.js"></script><script src="/js/osc-message.js"></script><script src="/js/device-identity.js"></script><script src="/js/paramspec.js"></script><script src="/js/value-box.js"></script><script src="/js/precision-field.js"></script><script src="/js/target-picker.js"></script><script src="/js/param-generator.js"></script><script src="/js/control-surface.js"></script><script src="/js/control-column.js"></script><script src="/js/facilitator.js"></script>
</body></html>
