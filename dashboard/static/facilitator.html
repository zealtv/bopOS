<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>bopOS Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101316">
<link rel="apple-touch-icon" href="/icon-180.png">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/facilitator.css">
</head>
<body>
  <div id="initial-loading" class="initial-loading" role="status" aria-live="polite" aria-label="bopOS is loading"><div class="bop-loader" aria-hidden="true"><strong>bopOS</strong><span class="bop-beats"><i></i><i></i><i></i><i></i></span><small>getting the room ready</small></div></div>
  <header><a id="technical-link" href="/">All views</a><h1 id="venue-name">bopOS Dashboard</h1><label class="theme-control">theme <select id="theme-select" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span id="ws-status" class="offline">connecting…</span></header>
  <section id="cue-panel" aria-labelledby="cue-title" hidden>
    <div class="cue-panel-head"><h2 id="cue-title">Cues</h2><label for="cue-lead">Lead <span><input id="cue-lead" type="number" min="100" max="10000" step="50" value="500"> ms</span></label></div>
    <div id="declared-cues"></div>
    <output id="cue-status" class="visually-hidden" role="status" aria-live="polite"></output>
  </section>
  <nav id="live-scope-tabs" role="tablist" aria-label="Live control scope">
    <button id="live-scope-aggregate" role="tab" aria-selected="true" aria-controls="cards" data-live-scope-view="aggregate">All &amp; Groups</button>
    <button id="live-scope-seats" role="tab" aria-selected="false" aria-controls="cards" data-live-scope-view="seats">Seats</button>
  </nav>
  <main id="cards" role="tabpanel" aria-labelledby="live-scope-aggregate"><p class="empty">Waiting for devices…</p></main>
  <footer id="controls">
    <div id="master-row"><span class="label">Master</span><input id="master" type="range" min="0" max="1" step="0.01"><output id="master-out"></output></div>
    <div id="buttons">
      <button id="silence" class="danger">SILENCE ALL</button>
    </div>
    <div id="facilitator-commands"></div>
    <div id="preset-section"><span id="preset-label">Seat presets</span><div id="presets"></div></div>
  </footer>
  <script src="/js/ws.js"></script><script src="/js/device-identity.js"></script><script src="/js/paramspec.js"></script><script src="/js/facilitator.js"></script>
</body></html>
