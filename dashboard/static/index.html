<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bopOS</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <header><h1>bopOS</h1><span id="online-count">0 / 0 online</span><button id="mute-all" class="danger">MUTE ALL</button><span id="ws-status" class="offline">disconnected</span></header>
  <div class="layout">
    <aside><h2>Devices</h2><div id="assigned"></div><h3>UNASSIGNED</h3><div id="unassigned"></div>
      <footer><button data-all="reboot">Reboot All</button><button data-all="update">Update All</button><button data-all="aloha">Aloha All</button>
        <div id="venue-bar"><h3>Venue</h3><select id="venue-select"></select><button id="venue-load">Load</button><button id="venue-save">Save as…</button></div>
      </footer>
    </aside>
    <main>
      <section id="spatial-section"><div class="section-head"><h2>Spatial</h2><span class="dim">room <input id="room-w" type="number" min="1" max="1000" step="0.5"> × <input id="room-d" type="number" min="1" max="1000" step="0.5"> m</span></div><svg id="spatial"></svg></section>
      <div id="detail"><p class="empty">Select a device.</p></div>
    </main>
  </div>
  <script src="/js/ws.js"></script><script src="/js/spatial.js"></script><script src="/js/dashboard.js"></script>
</body></html>
